<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavesh Navandar | Home</title>
    <style>
        :root {
            --navy: #101c2c;
            --teal: #68d8c3;
            --white: #ffffff;
            --muted: #e3e9ef;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--navy), #1f3149);
            color: var(--white);
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(92vw, 560px);
            padding: 42px 32px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            background: rgba(255,255,255,0.03);
            box-shadow: 0 18px 48px rgba(0,0,0,0.22);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        p {
            margin: 0 0 26px;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 22px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .primary {
            background: var(--teal);
            color: var(--navy);
        }

        .secondary {
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--white);
        }

        a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome</h1>
        <p>Explore my portfolio and projects built with HTML, CSS, and creative web design.</p>
        <div class="actions">
            <a class="primary" href="portfolio.html">Open Portfolio</a>
            <a class="secondary" href="portfolio.html#projects">View Projects</a>
        </div>
    </main>
</body>
</html>
